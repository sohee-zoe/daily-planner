<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>하루 플래너</title>
  <meta name="description" content="광고 없는 타임라인 데일리 플래너">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="플래너">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <button class="month-btn" id="monthLabel" aria-label="날짜 선택"></button>
        <div class="top-actions">
          <button class="chip" id="todayBtn">오늘</button>
          <button class="icon-btn" id="settingsBtn" aria-label="설정">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
        <input type="date" id="jumpDate" class="visually-hidden" tabindex="-1" aria-hidden="true">
      </div>
      <div class="week" id="week"></div>
    </header>

    <main id="main">
      <section id="dayView" class="view">
        <div class="progress" id="progress"></div>
        <div id="allDay" class="allday"></div>
        <ol id="timeline" class="timeline"></ol>
      </section>
      <section id="inboxView" class="view" hidden>
        <h2 class="view-title">인박스</h2>
        <p class="view-sub">시간을 아직 정하지 않은 할 일. 눌러서 날짜·시간을 지정하세요.</p>
        <ul id="inboxList" class="inbox-list"></ul>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="dayView">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <span>타임라인</span>
      </button>
      <button class="fab" id="addBtn" aria-label="할 일 추가">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-view="inboxView">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span>인박스 <b id="inboxCount" class="badge" hidden></b></span>
      </button>
    </nav>
  </div>

  <!-- Task editor sheet -->
  <dialog id="editor" class="sheet">
    <form method="dialog" id="editorForm" autocomplete="off">
      <div class="sheet-head">
        <button type="button" class="link" id="cancelEdit">취소</button>
        <strong id="editorTitle">새 할 일</strong>
        <button type="submit" class="link strong" id="saveEdit">저장</button>
      </div>
      <div class="sheet-body">
        <div class="title-row">
          <button type="button" class="icon-pick" id="iconPickBtn" aria-label="아이콘 선택"></button>
          <input id="fTitle" class="title-input" placeholder="무엇을 할까요?" maxlength="120" required>
        </div>
        <div class="emoji-grid" id="emojiGrid" hidden></div>

        <div class="colors" id="colorRow"></div>

        <div class="field seg" id="whenSeg">
          <button type="button" data-when="timed" class="on">시간 지정</button>
          <button type="button" data-when="allday">하루 종일</button>
          <button type="button" data-when="inbox">인박스</button>
        </div>

        <div class="field" id="dateField">
          <label for="fDate">날짜</label>
          <input type="date" id="fDate">
        </div>
        <div class="field" id="timeField">
          <label for="fStart">시작</label>
          <input type="time" id="fStart" step="300">
        </div>
        <div class="field col" id="durField">
          <label>소요 시간 <span id="durLabel" class="muted"></span></label>
          <div class="dur-chips" id="durChips"></div>
        </div>
        <div class="field" id="repeatField">
          <label for="fRepeat">반복</label>
          <select id="fRepeat">
            <option value="none">반복 안 함</option>
            <option value="daily">매일</option>
            <option value="weekdays">평일 (월–금)</option>
            <option value="weekly">매주</option>
            <option value="days">요일 선택</option>
            <option value="monthly">매월</option>
          </select>
        </div>
        <div class="field col" id="daysField" hidden>
          <label>반복 요일</label>
          <div class="dur-chips day-chips" id="dayChips"></div>
        </div>

        <div class="field col">
          <label>하위 작업</label>
          <ul class="subtasks" id="subList"></ul>
          <div class="sub-add">
            <input id="subInput" placeholder="하위 작업 추가" maxlength="120">
            <button type="button" class="chip" id="subAddBtn">추가</button>
          </div>
        </div>

        <div class="field col">
          <label for="fNotes">메모</label>
          <textarea id="fNotes" rows="3" placeholder="메모"></textarea>
        </div>

        <button type="button" class="danger" id="deleteBtn" hidden>삭제</button>
      </div>
    </form>
  </dialog>

  <!-- Repeat-delete chooser -->
  <dialog id="confirm" class="alert">
    <form method="dialog">
      <p id="confirmMsg"></p>
      <div class="alert-actions" id="confirmActions"></div>
    </form>
  </dialog>

  <!-- Settings sheet -->
  <dialog id="settings" class="sheet">
    <form method="dialog">
      <div class="sheet-head">
        <span></span>
        <strong>설정</strong>
        <button class="link strong">완료</button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="sTheme">테마</label>
          <select id="sTheme">
            <option value="system">시스템</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </div>
        <div class="field">
          <label for="sWeekStart">주 시작</label>
          <select id="sWeekStart">
            <option value="1">월요일</option>
            <option value="0">일요일</option>
          </select>
        </div>
        <div class="field">
          <label for="sNotify">시작 알림 <small class="muted">(앱이 열려 있을 때)</small></label>
          <input type="checkbox" id="sNotify" class="switch">
        </div>
        <div class="field col" id="customField">
          <label>내가 추가한 아이콘·색상 <small class="muted">— 눌러서 삭제</small></label>
          <div class="custom-list" id="customList"></div>
        </div>
        <div class="field col">
          <label>데이터 <small class="muted">— 이 기기 브라우저에만 저장됩니다</small></label>
          <div class="row-btns">
            <button type="button" class="chip" id="exportBtn">내보내기 (JSON)</button>
            <label class="chip" for="importFile">가져오기</label>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
        </div>
        <p class="muted small" id="installHint"></p>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
